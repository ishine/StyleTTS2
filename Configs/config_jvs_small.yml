# StyleTTS2 Japanese Training Configuration (JVS Small Scale)
# For validation of Japanese language support with JVS corpus (3 speakers)

log_dir: "Models/JVS_Small"
first_stage_path: "first_stage.pth"
save_freq: 5           # Save every 5 epochs for validation
log_interval: 10
device: "cuda"
epochs_1st: 50         # Reduced for validation (production: 200)
epochs_2nd: 30         # Reduced for validation (production: 100)
batch_size: 8          # Adjust based on GPU memory
max_len: 300           # Reduced frame limit for faster training
pretrained_model: ""
second_stage_load_pretrained: true
load_only_params: false

# Pre-trained model paths
F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
# Use multilingual PL-BERT for Japanese support
# Obtain this model before training: git clone https://huggingface.co/papercup-ai/multilingual-pl-bert Utils/PLBERT_multilingual
PLBERT_dir: 'Utils/PLBERT_multilingual/'

data_params:
  train_data: "Data/train_list_jvs.txt"
  val_data: "Data/val_list_jvs.txt"
  root_path: "Data/wavs_jvs"
  OOD_data: "Data/OOD_texts_ja.txt"
  min_length: 50

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  multispeaker: true   # Multiple speakers (jvs001, jvs002, jvs003)

  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80

  # Number of phoneme tokens used by the model
  # This value must match the vocabulary size in text_utils.py (len(symbols))
  n_token: 180
  max_dur: 50
  style_dim: 128

  dropout: 0.2

  # Decoder config
  decoder:
    type: 'istftnet'
    resblock_kernel_sizes: [3,7,11]
    upsample_rates: [10, 6]
    upsample_initial_channel: 512
    resblock_dilation_sizes: [[1,3,5], [1,3,5], [1,3,5]]
    upsample_kernel_sizes: [20, 12]
    gen_istft_n_fft: 20
    gen_istft_hop_size: 5

  # Speech language model config
  slm:
    model: 'microsoft/wavlm-base-plus'
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

  # Style diffusion model config
  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

loss_params:
  lambda_mel: 5.
  lambda_gen: 1.
  lambda_slm: 1.

  lambda_mono: 1.
  lambda_s2s: 1.
  TMA_epoch: 20        # Earlier start for validation (production: 50)

  lambda_F0: 1.
  lambda_norm: 1.
  lambda_dur: 1.
  lambda_ce: 20.
  lambda_sty: 1.
  lambda_diff: 1.

  diff_epoch: 10       # Earlier start for validation (production: 20)
  joint_epoch: 25      # Earlier start for validation (production: 50)

optimizer_params:
  lr: 0.0001
  bert_lr: 0.00001
  ft_lr: 0.00001

slmadv_params:
  min_len: 400
  max_len: 500
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
