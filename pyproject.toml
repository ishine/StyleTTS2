[project]
name = "styletts2"
version = "0.1.0"
description = "StyleTTS 2: Human-Level Text-to-Speech through Style Diffusion and Adversarial Training with Large Speech Language Models"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==0.26.1",
    "click==8.1.7",
    "einops==0.7.0",
    "einops-exts==0.0.4",
    "librosa==0.10.2",
    "matplotlib==3.8.2",
    "munch==4.0.0",
    "nltk==3.8.1",
    "pandas==2.2.0",
    "pydub==0.25.1",
    "pyyaml==6.0.1",
    "soundfile==0.12.1",
    "torch==2.2.0",
    "torchaudio==2.2.0",
    "tqdm==4.66.1",
    "transformers==4.37.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
inference = [
    "jupyter>=1.1.1",
    "phonemizer>=3.3.0",
]

# PyTorch CUDA 12.1 index configuration
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
